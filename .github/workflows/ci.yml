name: CI

on:
  push:
    branches: [main, production-hardening, ui-polish-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build & Prerender
        run: npm run build

      - name: Run test suite
        run: npm test
